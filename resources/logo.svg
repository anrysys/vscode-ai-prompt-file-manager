<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Colour master for icon.png (rasterise with rsvg-convert). Excluded from the VSIX.

    The palette is deliberately restrained: this is a working tool, so the greens and
    oranges sit well inside the sRGB gamut rather than at its neon edge. The plate is a
    slate-charcoal gradient rather than flat black, which reads as a surface rather than
    a hole on the Marketplace's dark and light backgrounds alike.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262E3B"/>
      <stop offset="1" stop-color="#151A22"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DBB8C"/>
      <stop offset="1" stop-color="#2E9C6A"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5983F"/>
      <stop offset="1" stop-color="#E0711C"/>
    </linearGradient>
    <!-- clears the bubble's stroke away from the bolt so the two never fuse
         once the icon is downscaled to the ~42px the Extensions list uses -->
    <mask id="boltCut" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <path d="M115.55 106.33L188.46 36.54L207.07 78.42L127.96 159.07Z" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="256" height="256" rx="40" fill="url(#plate)"/>
  <!-- a hairline of lighter slate at the top edge gives the plate a lit surface -->
  <rect x="0.5" y="0.5" width="255" height="255" rx="39.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <path d="M92.33 204.44L56.8 211.37L56.48 172.72A84.29 84.29 0 1 1 92.33 204.44Z" fill="none" stroke="url(#bubble)" stroke-width="15.42" stroke-linejoin="round" stroke-linecap="round" mask="url(#boltCut)"/>
  <path d="M188.46 36.54L115.55 106.33L169.84 106.33L127.96 159.07L207.07 78.42L158.98 78.42Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="5.14" stroke-linejoin="round"/>
</svg>
